[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "widgetgram"
version = "0.1.0"
description = "Telegram HTML widgets for aiogram 3 (Bot API 10.4+)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["telegram", "bot", "aiogram", "widget", "ton"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiogram>=3.4.0",
    "pydantic>=2.4",
]

[project.optional-dependencies]
ed25519 = ["pynacl>=1.5"]
evm = ["eth-account>=0.10", "eth-utils>=4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/yourname/widgetgram"
Issues = "https://github.com/yourname/widgetgram/issues"

[tool.setuptools.packages.find]
include = ["widgetgram*"]

[tool.setuptools.package-data]
widgetgram = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
